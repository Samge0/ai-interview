services:
  ai-interview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 持久化输出目录
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-interview-network

networks:
  ai-interview-network:
    driver: bridge
